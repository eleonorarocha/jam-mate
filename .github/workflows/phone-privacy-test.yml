name: Phone Privacy Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  phone-privacy-test:
    name: Run phone privacy SQL tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done

      - name: Bootstrap schema (roles, extensions, auth shim)
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- Supabase-like roles required by migrations
          DO $$ BEGIN
            CREATE ROLE anon NOLOGIN NOINHERIT;
          EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN
            CREATE ROLE authenticated NOLOGIN NOINHERIT;
          EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN
            CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
          EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN
            CREATE ROLE authenticator NOINHERIT LOGIN PASSWORD 'postgres';
          EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          GRANT anon, authenticated, service_role TO authenticator;

          CREATE EXTENSION IF NOT EXISTS pgcrypto;

          -- Minimal auth schema shim so SECURITY DEFINER fns referencing auth.uid() work
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid()
          );
          SQL

      - name: Prepare debug output directory
        run: mkdir -p debug-output

      - name: Apply migrations
        run: |
          shopt -s nullglob
          for f in supabase/migrations/*.sql; do
            echo "Applying $f" | tee -a debug-output/migrations.log
            psql -v ON_ERROR_STOP=1 -f "$f" 2>&1 | tee -a debug-output/migrations.log
          done

      - name: Run phone privacy tests
        id: run_tests
        run: |
          set -o pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/tests/phone_privacy_test.sql 2>&1 \
            | tee debug-output/phone_privacy_test.log

      - name: Collect Postgres diagnostics on failure
        if: failure()
        continue-on-error: true
        run: |
          echo "=== Postgres container logs ===" > debug-output/postgres.log
          docker ps -a >> debug-output/postgres.log 2>&1 || true
          for cid in $(docker ps -aq --filter ancestor=postgres:15); do
            echo "--- Logs for $cid ---" >> debug-output/postgres.log
            docker logs "$cid" >> debug-output/postgres.log 2>&1 || true
          done

          echo "=== Schema snapshot ===" > debug-output/schema.log
          psql -v ON_ERROR_STOP=0 -c "\dt public.*"        >> debug-output/schema.log 2>&1 || true
          psql -v ON_ERROR_STOP=0 -c "\df public.*"        >> debug-output/schema.log 2>&1 || true
          psql -v ON_ERROR_STOP=0 -c "\dp public.profiles" >> debug-output/schema.log 2>&1 || true
          psql -v ON_ERROR_STOP=0 \
            -c "SELECT schemaname, tablename, policyname, cmd, roles, qual, with_check
                FROM pg_policies WHERE schemaname='public' ORDER BY tablename, policyname;" \
            >> debug-output/schema.log 2>&1 || true

          echo "=== GRANTs & privileges snapshot ===" > debug-output/grants.log
          for obj in profiles profiles_public; do
            echo "============================================" >> debug-output/grants.log
            echo "## public.$obj — \\dp+"                       >> debug-output/grants.log
            echo "============================================" >> debug-output/grants.log
            psql -v ON_ERROR_STOP=0 -c "\dp+ public.$obj"        >> debug-output/grants.log 2>&1 || true

            echo "## public.$obj — table_privileges"            >> debug-output/grants.log
            psql -v ON_ERROR_STOP=0 \
              -c "SELECT grantee, privilege_type, is_grantable
                  FROM information_schema.table_privileges
                  WHERE table_schema='public' AND table_name='$obj'
                  ORDER BY grantee, privilege_type;"             >> debug-output/grants.log 2>&1 || true

            echo "## public.$obj — column_privileges"           >> debug-output/grants.log
            psql -v ON_ERROR_STOP=0 \
              -c "SELECT grantee, column_name, privilege_type, is_grantable
                  FROM information_schema.column_privileges
                  WHERE table_schema='public' AND table_name='$obj'
                  ORDER BY grantee, column_name, privilege_type;" >> debug-output/grants.log 2>&1 || true

            echo "## public.$obj — ACL via pg_class"            >> debug-output/grants.log
            psql -v ON_ERROR_STOP=0 \
              -c "SELECT n.nspname, c.relname, c.relkind, c.relrowsecurity, c.relforcerowsecurity, c.relacl
                  FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                  WHERE n.nspname='public' AND c.relname='$obj';" >> debug-output/grants.log 2>&1 || true

            echo "## public.$obj — column ACLs via pg_attribute" >> debug-output/grants.log
            psql -v ON_ERROR_STOP=0 \
              -c "SELECT a.attname, a.attacl
                  FROM pg_attribute a
                  JOIN pg_class c ON c.oid=a.attrelid
                  JOIN pg_namespace n ON n.oid=c.relnamespace
                  WHERE n.nspname='public' AND c.relname='$obj'
                    AND a.attnum > 0 AND NOT a.attisdropped
                  ORDER BY a.attnum;"                            >> debug-output/grants.log 2>&1 || true
          done

          echo "## Helper functions — privileges"               >> debug-output/grants.log
          psql -v ON_ERROR_STOP=0 \
            -c "SELECT n.nspname, p.proname, pg_get_userbyid(p.proowner) AS owner,
                       p.prosecdef AS security_definer, p.proacl
                FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace
                WHERE n.nspname='public'
                  AND p.proname IN ('can_view_sensitive_profile','get_profile_sensitive',
                                    'has_accepted_booking_with','has_role')
                ORDER BY p.proname;"                              >> debug-output/grants.log 2>&1 || true

          echo "## Roles overview"                              >> debug-output/grants.log
          psql -v ON_ERROR_STOP=0 \
            -c "SELECT rolname, rolsuper, rolinherit, rolbypassrls, rolcanlogin
                FROM pg_roles
                WHERE rolname IN ('anon','authenticated','service_role','authenticator','postgres')
                ORDER BY rolname;"                                >> debug-output/grants.log 2>&1 || true

          cp -v supabase/tests/phone_privacy_test.sql debug-output/ || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phone-privacy-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug-output/
          retention-days: 14
          if-no-files-found: warn
